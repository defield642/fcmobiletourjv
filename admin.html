<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FC Mobile Tournament · Admin</title><style>:root{--bg:#070a1f;--card:#12163f;--border:#2a2f6e;--cyan:#00e5ff;--gold:#f4c542;--red:#ff5470;--text:#f1f3ff;--dim:#9198c9}*{box-sizing:border-box}body{margin:0;padding:18px 12px 40px;background:radial-gradient(circle at 50% -10%,#22206b,var(--bg) 60%);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto}.back{color:var(--cyan);text-decoration:none;font-weight:800;font-size:12px}.hero{text-align:center;padding:28px 0 18px}.tag{font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:900}.h1{font-size:24px;font-weight:900;margin:8px 0}.sub,.notice{color:var(--dim);font-size:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}.action,.send,.unlock{display:block;width:100%;margin:10px 0;padding:13px;border-radius:11px;background:rgba(244,197,66,.08);border:1px solid var(--gold);color:var(--gold);font-weight:900;text-align:left;cursor:pointer}.action.red{border-color:var(--red);color:var(--red)}.send,.unlock{background:linear-gradient(135deg,var(--cyan),#4678ff);border:0;color:#07102e;text-align:center}.key{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b0f2c;color:var(--text);font:inherit}.match{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px}.match-title{font-weight:900;margin-bottom:9px}.score-row{display:grid;grid-template-columns:1fr 70px 70px;gap:8px;align-items:center}.score-row input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b0f2c;color:var(--text);font:inherit}.save{grid-column:1/-1;padding:10px;border:0;border-radius:8px;background:var(--cyan);color:#07102e;font-weight:900;cursor:pointer}.members{display:grid;gap:7px;margin-top:12px}.member{display:flex;justify-content:space-between;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:12px}.member span{color:var(--dim);font-size:11px}textarea{width:100%;margin-top:12px;background:#0b0f2c;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font:inherit}</style></head><body><main class="wrap"><a class="back" href="FC%20Mobile%20Tournament.html">← Back to registration</a><section class="hero"><div class="tag">EA SPORTS FC MOBILE</div><div class="h1">ADMIN CONTROL CENTRE</div><div class="sub">Admin key required for result editing</div></section><section class="card"><input id="key" class="key" type="password" autocomplete="off" placeholder="Enter ADMIN_ACCESS_KEY"><button class="unlock" onclick="unlock()">UNLOCK ADMIN CONTROLS</button><div class="notice" id="notice"></div></section><section class="card" id="controls" hidden><h2>Edit match results</h2><div class="notice">Enter both teams' final scores. Results update the shared fixture table.</div><div id="matches"></div></section><section class="card" id="actions" hidden><button class="action red" onclick="act('close-registrations')">1 · CLOSE REGISTRATIONS</button><button class="action" onclick="act('handle-members')">2 · HANDLE NEW MEMBERS</button><button class="action" onclick="act('start-tournament')">3 · START TOURNAMENT</button><button class="action" onclick="listMembers()">4 · LIST REGISTERED MEMBERS</button><textarea id="error" rows="4" placeholder="Describe an error on a fixture..."></textarea><button class="send" onclick="sendScoreError()">SEND SCORE ERROR</button><div class="members" id="members"></div></section></main><script>const api=window.__FCMOBILE_API__||((location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.protocol==='file:')?'http://127.0.0.1:8080/api':'https://fcmobile-tournament-api.onrender.com/api');let key='',dbDoc=null,state=null,users=[];function note(t){document.getElementById('notice').textContent=t}async function unlock(){key=document.getElementById('key').value.trim();if(!key){note('Enter the admin key.');return}try{const r=await fetch(api+'/admin/verify',{headers:{'X-Admin-Key':key}});if(!r.ok)throw Error('Invalid admin key');const db=await window.claude.use('db');dbDoc=db.doc('tournament/state');const snap=await dbDoc.get();state=snap.exists?snap.data():{fixtures:[],knockout:null};users=await (await fetch(api+'/users')).json();document.getElementById('controls').hidden=false;document.getElementById('actions').hidden=false;note('Admin controls unlocked.');renderMatches()}catch(e){note(e.message||'Could not unlock admin controls.')}}function allMatches(){let a=(state&&state.fixtures||[]).map(m=>({m,stage:'league'}));if(state&&state.knockout)for(const stage of ['r16','qf','final'])a=a.concat((state.knockout[stage]||[]).map(m=>({m,stage})));return a}function name(id){const u=users.find(x=>String(x.id)===String(id));return u?u.username:String(id)}function renderMatches(){const box=document.getElementById('matches');const list=allMatches();box.innerHTML=list.length?list.map(({m,stage})=>'<div class="match"><div class="match-title">'+stage.toUpperCase()+' · '+name(m.h)+' vs '+name(m.a)+'</div><div class="score-row"><span>Home / Away</span><input id="h-'+m.id+'" type="number" min="0" max="99" value="'+(Number.isInteger(m.hs)?m.hs:'')+'" placeholder="0"><input id="a-'+m.id+'" type="number" min="0" max="99" value="'+(Number.isInteger(m.as)?m.as:'')+'" placeholder="0"><button class="save" onclick="saveScore(\''+m.id+'\',\''+stage+'\',\''+m.h+'\',\''+m.a+'\')">SAVE RESULT</button></div></div>').join(''):'<div class="notice">No generated fixtures yet.</div>'}async function saveScore(id,stage,h,a){const hs=Number(document.getElementById('h-'+id).value),as=Number(document.getElementById('a-'+id).value);if(!Number.isInteger(hs)||!Number.isInteger(as)||hs<0||as<0){note('Enter valid scores for both teams.');return}const found=allMatches().find(x=>x.m.id===id);if(!found)return;const m=found.m;m.hs=hs;m.as=as;m.draw=hs===as;m.status='played';m.winner=hs===as?null:(hs>as?h:a);try{await dbDoc.set(state);note('Result saved for '+name(h)+' '+hs+' - '+as+' '+name(a));renderMatches()}catch(e){note('Could not save result: '+e.message)}}async function act(a){try{const r=await fetch(api+'/admin/'+a,{method:'POST',headers:{'X-Admin-Key':key}});if(!r.ok)throw Error(await r.text());note('Completed: '+a.replaceAll('-',' '))}catch(e){note('Action failed: '+e.message)}}async function sendScoreError(){const message=document.getElementById('error').value.trim();if(!message){note('Describe the fixture error first.');return}try{const r=await fetch(api+'/admin/score-error',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({message})});if(!r.ok)throw Error(await r.text());note('Score error sent.');document.getElementById('error').value=''}catch(e){note('Could not send error: '+e.message)}}async function listMembers(){try{const data=await (await fetch(api+'/users')).json();document.getElementById('members').innerHTML=data.map(u=>'<div class="member"><b>'+u.username+'</b><span>'+u.location+' · OVR '+(u.squadOvr||125)+'</span></div>').join('')||'<div class="notice">No registered members yet.</div>'}catch(e){note('Could not load members.')}}</script></body></html>
