<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FC Mobile Tournament · Admin</title><style>:root{--bg:#070a1f;--card:#12163f;--border:#2a2f6e;--cyan:#00e5ff;--gold:#f4c542;--red:#ff5470;--text:#f1f3ff;--dim:#9198c9}*{box-sizing:border-box}body{margin:0;padding:18px 12px 40px;background:radial-gradient(circle at 50% -10%,#22206b,var(--bg) 60%);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto}.back{color:var(--cyan);text-decoration:none;font-weight:800;font-size:12px}.hero{text-align:center;padding:28px 0 18px}.tag{font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:900}.h1{font-size:24px;font-weight:900;margin:8px 0}.sub{color:var(--dim);font-size:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}.action{display:block;width:100%;margin:10px 0;padding:14px;border-radius:11px;background:rgba(244,197,66,.08);border:1px solid var(--gold);color:var(--gold);font-weight:900;text-align:left;cursor:pointer}.action.red{border-color:var(--red);color:var(--red)}.send{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--cyan),#4678ff);color:#07102e;font-weight:900;cursor:pointer}textarea{width:100%;margin-top:12px;background:#0b0f2c;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font:inherit}.notice{color:var(--dim);font-size:12px;margin-top:12px;min-height:18px}.members{display:grid;gap:7px;margin-top:12px}.member{display:flex;justify-content:space-between;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:12px}.member span{color:var(--dim);font-size:11px}</style></head><body><main class="wrap"><a class="back" href="FC%20Mobile%20Tournament.html">← Back to registration</a><section class="hero"><div class="tag">EA SPORTS FC MOBILE</div><div class="h1">ADMIN CONTROL CENTRE</div><div class="sub">Tournament management</div></section><section class="card"><button class="action red" onclick="act('close-registrations')">1 · CLOSE REGISTRATIONS</button><button class="action" onclick="act('handle-members')">2 · HANDLE NEW MEMBERS</button><button class="action" onclick="act('start-tournament')">3 · START TOURNAMENT</button><button class="action" onclick="listMembers()">4 · LIST REGISTERED MEMBERS</button><button class="action" onclick="document.getElementById('error').focus()">5 · SCORE ERROR</button><textarea id="error" rows="4" placeholder="Describe an error on a fixture..."></textarea><button class="send" onclick="sendScoreError()">SEND SCORE ERROR</button><div class="notice" id="notice"></div><div class="members" id="members"></div></section></main><script>const api=window.__FCMOBILE_API__||((location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.protocol==='file:')?'http://127.0.0.1:8080/api':'https://fcmobile-tournament-api.onrender.com/api');async function act(a){const n=document.getElementById('notice');try{const r=await fetch(api+'/admin/'+a,{method:'POST'});if(!r.ok)throw Error();n.textContent='Completed: '+a.replaceAll('-',' ')}catch(e){n.textContent='API unavailable. Start the backend first.'}}async function sendScoreError(){const n=document.getElementById('notice');const message=document.getElementById('error').value.trim();if(!message){n.textContent='Please describe the score or fixture error first.';return}try{const r=await fetch(api+'/admin/score-error',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});if(!r.ok)throw Error();n.textContent='Score error sent successfully.';document.getElementById('error').value='';}catch(e){n.textContent='Could not send score error. Check the API connection.'}}async function listMembers(){const box=document.getElementById('members');try{const r=await fetch(api+'/users');const users=await r.json();box.innerHTML=users.map(u=>'<div class="member"><b>'+u.username+'</b><span>'+u.location+' · OVR '+(u.squadOvr||125)+'</span></div>').join('')||'<div class="notice">No registered members yet.</div>'}catch(e){box.innerHTML='<div class="notice">API unavailable.</div>'}}</script></body></html>
