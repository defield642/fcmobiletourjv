services:
  - type: web
    name: fcmobile-tournament-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fcmobile-tournament-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_ACCESS_PIN
        sync: false

  - type: web
    name: fcmobile-tournament-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: .

databases:
  - name: fcmobile-tournament-db
    plan: free
